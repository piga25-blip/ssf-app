# VERSION RÉSEAU (TEST) — identité distincte de la version officielle :
# s'installe à côté, dossier de données séparé, aucune publication GitHub.
appId: fr.ssf.app.reseau
productName: Application SSF Reseau (test)
copyright: Copyright © 2026 Secours Souterrain Français

directories:
  output: dist
  buildResources: assets

files:
  - "**/*"
  - "!dist/**"
  - "!.git/**"
  - "!.claude/**"
  - "!App_SSF_*"
  - "!docs/**"
  - "!tests/**"

win:
  icon: assets/SSF.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Application SSF Reseau (test)

# Pas de certificat Apple Developer : build non signé, non notarié.
# Les utilisateurs Mac devront faire clic droit > Ouvrir au premier lancement
# (Gatekeeper refuse un double-clic normal sur une app non identifiée).
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false

# Aucune publication : cette version ne doit jamais partir dans les mises à jour.
publish: null
