appId: fr.ssf.app
productName: Application SSF
copyright: Copyright © 2026 Secours Souterrain Français

directories:
  output: dist
  buildResources: assets

files:
  - "**/*"
  - "!dist/**"
  - "!.git/**"
  - "!.claude/**"
  - "!App_SSF_*"

win:
  icon: assets/SSF.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Application SSF

# Pas de certificat Apple Developer : build non signé, non notarié.
# Les utilisateurs Mac devront faire clic droit > Ouvrir au premier lancement
# (Gatekeeper refuse un double-clic normal sur une app non identifiée).
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false

publish:
  provider: github
  owner: piga25-blip
  repo: ssf-app
  releaseType: release
  private: false
